name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # aws-lc-sys（rustls）需要 musl 交叉编译器（spec 08）
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build musl binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/hoverstare

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          name="hoverstare-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          cd target/x86_64-unknown-linux-musl/release
          tar czf "../../../dist/${name}.tar.gz" hoverstare
          cd ../../../dist
          sha256sum "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
