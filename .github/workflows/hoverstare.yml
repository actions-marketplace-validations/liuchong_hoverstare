# 本仓库自举（dogfood）：用 hoverstare 审查 hoverstare 自己的 PR，
# 并运行 spec 11 的开发模式（issue 讨论/计划、PR 分支开发、合并命令）。
# 与用户侧接法的区别：这里从源码构建二进制（避免鸡生蛋问题），
# 用户应使用 action.yml（下载预编译二进制，见 README）。
name: HoverStare (dogfood)

on:
  # 手动触发是 master 坏掉时的自救入口：可以指定要审查的 PR 和要构建的版本。
  workflow_dispatch:
    inputs:
      pr:
        description: "要处理的 PR 编号（手动触发时必填）"
        required: false
        default: ""
      version:
        description: "构建用的 ref：分支/tag/commit（留空 = 事件所在版本）"
        required: false
        default: ""
  pull_request:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  # 不含 @hoverstare 的评论/review 事件给独立组名：run 级并发组先于 job if 生效，
  # 否则 bot 自己发的 review（pull_request_review 事件）会取消正在跑的审查
  group: >-
    hoverstare-${{
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && !(contains(github.event.comment.body, '@hoverstare')
          && (github.event.comment.user.login != 'hoverstare[bot]' || startsWith(github.event.comment.body, '@hoverstare continue')))
        && format('noop-{0}', github.event.comment.id))
      || (github.event_name == 'pull_request_review'
        && !contains(github.event.review.body, '@hoverstare')
        && format('noop-review-{0}', github.event.review.id))
      || ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review')
        && format('dev-{0}', github.event.issue.number || github.event.pull_request.number))
      || (github.event.pull_request.number || github.event.issue.number || inputs.pr)
    }}
  # 评论/review 类事件是开发轮入口：取消会把"正在跑的那一轮"杀掉，而这正是
  # 自驱动队列要避免的（新任务开工时老任务还没完成）。这些事件改成排队等待，
  # 其余事件（PR 审查）保持取消语义。见 spec 11 自驱动队列。
  cancel-in-progress: >-
    ${{
      !(github.event_name == 'issue_comment'
        || github.event_name == 'pull_request_review_comment'
        || github.event_name == 'pull_request_review')
    }}

jobs:
  hoverstare:
    runs-on: ubuntu-latest
    # 排队语义下没有取消可依赖：一轮卡住会一直占着并发组，必须有硬上限。
    timeout-minutes: 30
    # bot 自己的评论一律不触发，除非是自触发命令（spec 11 §6 熔断由 devagent 轮次计数保证）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@hoverstare')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@hoverstare') && github.event.review.user.login != 'hoverstare[bot]') ||
      (contains(github.event.comment.body, '@hoverstare') &&
        (github.event.comment.user.login != 'hoverstare[bot]' || startsWith(github.event.comment.body, '@hoverstare continue'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.in_reply_to_id &&
        github.event.comment.user.type != 'Bot')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # show_base_file 需要 base 分支历史
          fetch-tags: true # 版本可用 tag 指定（自救时）
          persist-credentials: false

      # 版本自救（spec 08）：默认用事件所在版本构建；PR body / 任意近期评论 / 触发
      # 评论里写 `hoverstare-pin: <ref>`，或手动触发时填 version，就改成构建那个 ref。
      # 评论是"可编辑"的：所以不只读触发的那一条，而是读最近若干条评论（新→旧），
      # 让改过/较早写下的标记同样生效。工作区仍是被处理的那份代码，只有二进制来自 pin。
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'event' }}
          DISPATCH_VERSION: ${{ inputs.version }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENTS: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Pure bash extraction: grep/sed behaviour depends on the runner's
          # locale and on how it treats multi-byte input, and a marker that
          # silently fails to match is worse than no marker at all. The LAST
          # marker in the text wins, because the newest instruction is the one
          # meant.
          extract() {
            local rest lower candidate found
            lower=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            rest="$lower"
            found=""
            while [[ "$rest" == *hoverstare-pin:* ]]; do
              rest="${rest#*hoverstare-pin:}"
              candidate="${rest#"${rest%%[![:space:]]*}"}"
              candidate="${candidate%%[^a-z0-9._/-]*}"
              if [ -n "$candidate" ]; then found="$candidate"; fi
            done
            printf '%s' "$found"
          }
          ref="$DISPATCH_VERSION"
          # Where the ref came from, so the round report can name it aloud: the
          # PR body carries the flow-level pin (written by `go`), a comment or a
          # review body carries an instruction marker, and a manual run carries
          # its `version` input. Only these four literals are ever written.
          source_kind="dispatch"
          # Recent comments newest-first, then the event's own bodies. The last
          # marker inside each text wins, so the newest instruction is the one
          # meant. `scan` also records which text produced the ref.
          scan() {
            local kind="$1" text="$2" found
            found=$(extract "$text")
            if [ -n "$found" ]; then
              ref="$found"
              source_kind="$kind"
              return 0
            fi
            return 1
          }
          if [ -z "$ref" ] && [ -n "$NUMBER" ]; then
            bodies=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=30" \
              --jq '.[].body' 2>/dev/null | tac || true)
            for text in "$COMMENTS" "$bodies"; do
              if scan marker "$text"; then break; fi
            done
          fi
          if [ -z "$ref" ]; then
            for pair in "marker|$COMMENTS" "marker|$REVIEW_BODY" "flow-pin|$PR_BODY" "marker|$ISSUE_BODY"; do
              if scan "${pair%%|*}" "${pair#*|}"; then break; fi
            done
          fi
          echo "pin scan: dispatch=[$DISPATCH_VERSION] comments_len=${#COMMENTS} resolved=[$ref] source=[$source_kind]"
          if [ -z "$ref" ]; then
            # No ref: the binary is the event's revision. A manual run whose
            # `version` input is empty is still "dispatch"; everything else is
            # the event's own version.
            if [ "$MODE" = "dispatch" ]; then
              echo "source=dispatch" >> "$GITHUB_OUTPUT"
            else
              echo "source=event" >> "$GITHUB_OUTPUT"
            fi
            echo "mode=event" >> "$GITHUB_OUTPUT"
            echo "using the event's own revision"
            exit 0
          fi
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::hoverstare-pin ref is not a plain ref name: $ref"
            exit 1
          fi
          # 只有维护者能创建的 ref 才被接受：任何能开 PR 的人都能往 PR body 里写标记，
          # 而 workflow 手上有写权限，不能让人指着一份自己控制的代码去构建运行。
          # A marker may name master, a release tag, or a commit that is already
          # reachable from the default branch. A branch is never accepted: anyone
          # who can open a pull request can write the marker, and the workflow
          # holds write permissions. A reachable commit is maintainer-controlled
          # and is what a flow records to keep its own rounds on one revision.
          if [ "$MODE" != "dispatch" ] \
             && [ "$ref" != "master" ] \
             && ! printf '%s' "$ref" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{7,40}$'; then
              echo "::error::hoverstare-pin from a PR or comment may only name master, a release tag, or a commit; got: $ref"
              exit 1
            fi
            git fetch --quiet origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" || true
            if ! git merge-base --is-ancestor "$(git rev-parse --verify --quiet "${ref}^{commit}")" "refs/remotes/origin/${DEFAULT_BRANCH}" 2>/dev/null; then
              echo "::error::hoverstare-pin commit is not reachable from ${DEFAULT_BRANCH}; refusing to build it: $ref"
              exit 1
            fi
          fi
          # Resolve the pinned ref to a commit. A `pull_request` checkout is a
          # detached merge commit with no local master or tags, so fetch the
          # right shape first and look the object up in every place it can live:
          # this is what broke every review run on a PR whose flow was pinned to
          # `master` ("hoverstare-pin ref not found: master").
          case "$ref" in
            master)
              git fetch --no-tags --quiet "origin" \
                "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" 2>/dev/null || true
              ;;
            v[0-9]*)
              git fetch --no-tags --quiet origin "refs/tags/${ref}:refs/tags/${ref}" 2>/dev/null || true
              ;;
            *)
              git fetch --no-tags --quiet origin "$ref" 2>/dev/null || true
              ;;
          esac
          commit=$(git rev-parse --verify --quiet "${ref}^{commit}" \
                || git rev-parse --verify --quiet "refs/remotes/origin/${ref}^{commit}" \
                || git rev-parse --verify --quiet "refs/tags/${ref}^{commit}" || true)
          if [ -z "$commit" ]; then
            echo "::error::hoverstare-pin ref not found: $ref"
            exit 1
          fi
          echo "mode=pinned" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "source=$source_kind" >> "$GITHUB_OUTPUT"
          echo "::notice::building hoverstare from pinned ref $ref ($commit)"

      - name: Add pinned source worktree
        if: steps.source.outputs.mode == 'pinned'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/hoverstare-src" \
            "${{ steps.source.outputs.commit }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The pinned worktree gets its own cache, keyed by the pinned revision:
      # every round of one flow then rebuilds nothing.
      - uses: Swatinem/rust-cache@v2
        if: steps.source.outputs.mode == 'pinned'
        with:
          workspaces: ${{ runner.temp }}/hoverstare-src -> target
          key: pin-${{ steps.source.outputs.commit }}

      - name: Build (event revision)
        if: steps.source.outputs.mode != 'pinned'
        run: cargo build --release

      # 只有二进制来自 pin；工作区（工具读的代码）仍是被处理的那份。
      - name: Build (pinned revision)
        if: steps.source.outputs.mode == 'pinned'
        working-directory: ${{ runner.temp }}/hoverstare-src
        run: cargo build --release

      - name: Resolve binary path
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.mode }}" = "pinned" ]; then
            echo "path=${{ runner.temp }}/hoverstare-src/target/release/hoverstare" >> "$GITHUB_OUTPUT"
          else
            echo "path=./target/release/hoverstare" >> "$GITHUB_OUTPUT"
          fi

      # 品牌身份：评论/推送用 hoverstare[bot]（App token 可触发 CI）
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOVERSTARE_APP_ID }}
          private-key: ${{ secrets.HOVERSTARE_APP_PRIVATE_KEY }}

      # 开发轮的提交必须签名。CI 上没有本机的 GPG 配置，不配置就会静默产出未签名提交
      # （`git log --format=%G?` = N）。需要 secret：HOVERSTARE_GPG_PRIVATE_KEY（armored
      # 私钥）与可选 HOVERSTARE_GPG_PASSPHRASE。导入后先做一次空提交自检，签不出来就红。
      - name: Configure commit signing
        # `secrets` is not available in a step `if`; pass it through env and test
        # the env value instead (a secrets reference here makes the whole
        # workflow invalid, and GitHub then fails every push with a run named
        # after this file -- the dogfood went silently dead once already).
        if: env.GPG_PRIVATE_KEY != ''
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HOVERSTARE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.HOVERSTARE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$key_id" ]; then
            echo "::error::HOVERSTARE_GPG_PRIVATE_KEY imported no secret key material"
            exit 1
          fi
          git config --global user.signingkey "$key_id"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
            chmod 600 "$RUNNER_TEMP/gpg-passphrase"
            printf '%s\n' '#!/bin/sh' 'exec gpg --pinentry-mode loopback --passphrase-file "$GPG_PASSPHRASE_FILE" "$@"' > "$RUNNER_TEMP/gpg-loopback"
            chmod +x "$RUNNER_TEMP/gpg-loopback"
            git config --global gpg.program "$RUNNER_TEMP/gpg-loopback"
          fi
          git config --global commit.gpgsign true
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/gpg-passphrase" >> "$GITHUB_ENV"
          # 自检：空提交必须签得出来，否则本轮之后所有提交都会静默未签名。
          git -c user.name=check -c user.email=check@example.invalid commit --allow-empty -q -m "signing self-check"
          status=$(git log -1 --format=%G?)
          git reset -q --hard HEAD~1
          if [ "$status" != "G" ] && [ "$status" != "U" ]; then
            echo "::error::commit signing self-check failed (status=$status); refusing to run unsigned"
            exit 1
          fi
          echo "::notice::commit signing ready (key $key_id, status $status)"

      # 路由（spec 09/11）：pull_request -> review；纯 issue -> develop；
      # PR 评论 review|explain|help|空 -> mention；其余 -> develop
      - name: Run hoverstare
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.HOVERSTARE_LLM_KEY }}
          OPENAI_BASE_URL: ${{ vars.HOVERSTARE_LLM_BASE_URL }}
          HOVERSTARE_MODEL: ${{ vars.HOVERSTARE_MODEL }}
          HOVERSTARE_THINKING: ${{ vars.HOVERSTARE_THINKING }}
          HOVERSTARE_REASONING_EFFORT: ${{ vars.HOVERSTARE_REASONING_EFFORT }}
          HOVERSTARE_CONTEXT_TOKENS: ${{ vars.HOVERSTARE_CONTEXT_TOKENS }}
          # Build provenance (spec 11 §6): the round report names the revision
          # the binary was built from. Pinned builds export `commit`; event and
          # manual builds fall back to the event's own revision.
          HOVERSTARE_BUILD_MODE: ${{ steps.source.outputs.source }}
          HOVERSTARE_BUILT_FROM: ${{ steps.source.outputs.commit || github.sha }}
        run: |
          set -euo pipefail
          bin="${{ steps.binary.outputs.path }}"
          cmd="review"
          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ -z "${{ inputs.pr }}" ]; then
                echo "::error::manual runs need the pr input（手动触发时请填要处理的 PR 编号）"
                exit 1
              fi
              cmd="review"
              "$bin" "$cmd" --pr "${{ inputs.pr }}"
              exit 0 ;;
            issues)
              cmd="develop" ;;
            issue_comment)
              if jq -e '.issue.pull_request == null' "$GITHUB_EVENT_PATH" >/dev/null; then
                cmd="develop"
              else
                after=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" \
                  | { grep -oE '@hoverstare.*' || true; } | head -1)
                after="$(echo "${after#@hoverstare}" | xargs || true)"
                word="$(echo "$after" | awk '{print tolower($1)}')"
                if [ -z "$after" ] || [ "$word" = "review" ] || [ "$word" = "explain" ] || [ "$word" = "help" ]; then
                  cmd="mention"
                else
                  cmd="develop"
                fi
              fi ;;
            pull_request_review_comment|pull_request_review)
              after=$(jq -r '.comment.body // .review.body // ""' "$GITHUB_EVENT_PATH" \
                | { grep -oE '@hoverstare.*' || true; } | head -1)
              after="$(echo "${after#@hoverstare}" | xargs || true)"
              word="$(echo "$after" | awk '{print tolower($1)}')"
              if [ -z "$after" ] || [ "$word" = "review" ] || [ "$word" = "explain" ] || [ "$word" = "help" ]; then
                cmd="mention"
              else
                cmd="develop"
              fi ;;
            *)
              cmd="review" ;;
          esac
          "$bin" "$cmd"
