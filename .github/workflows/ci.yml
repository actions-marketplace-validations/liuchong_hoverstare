name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # 工作流文件本身的语法错误会让 GitHub 直接判定该工作流无效：每次 push 只会得到一个以
  # 文件名命名的失败 run，而 dogfood 静默失效。所以这里先 lint workflow。
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: |
          set -euo pipefail
          # 只拦"工作流无效"这一类错误（表达式上下文、schema）：这正是让 dogfood 静默失效的
          # 那种。shellcheck 的风格提示（SC2129 重定向、SC2016 单引号）不是这里的门禁对象，
          # 否则每次都要为风格红一次。把空值传给 -shellcheck 即关闭该集成。
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color -shellcheck=

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # A branch-ref action cannot infer the toolchain from a pinned SHA.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: musl build smoke
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
