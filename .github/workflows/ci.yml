name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # 工作流文件本身的语法错误会让 GitHub 直接判定该工作流无效：每次 push 只会得到一个以
  # 文件名命名的失败 run，而 dogfood 静默失效。所以这里先 lint workflow。
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: |
          set -euo pipefail
          # 只拦"工作流无效"这一类错误（表达式上下文、schema）：这正是让 dogfood 静默失效的
          # 那种。shellcheck 的风格提示（SC2129 重定向、SC2016 单引号）不是这里的门禁对象，
          # 否则每次都要为风格红一次。把空值传给 -shellcheck 即关闭该集成。
          # The image is pinned by digest (actionlint 1.7.12, linux/amd64): a
          # floating tag would change what runs here without any commit of ours.
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
            -color -shellcheck=

  # Engineering gates (spec 17). One entry point for the whole gate set, so what a
  # contributor runs locally is what CI enforces. Split in two because the heavy
  # pair needs a toolchain and minutes: a single job that took over an hour with no
  # visible progress is a black box, not a gate. Both are blocking.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: G5 scans commits, not just the working tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # actionlint (G6) and gitleaks (G5) are not Rust crates, so they come from
      # their upstream releases with the published checksums verified: a gate tool
      # should not itself be a floating download. The filenames are kept as
      # published because `sha256sum -c` looks the file up by that name.
      - name: Install actionlint and gitleaks (pinned + checksum)
        run: |
          set -euo pipefail
          cd /tmp

          actionlint_version=1.7.12
          actionlint_tar="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_base="https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}"
          curl -fsSL "${actionlint_base}/${actionlint_tar}" -o "${actionlint_tar}"
          curl -fsSL "${actionlint_base}/actionlint_${actionlint_version}_checksums.txt" -o actionlint.sums
          grep " ${actionlint_tar}$" actionlint.sums | sha256sum -c -
          tar -xzf "${actionlint_tar}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version

          gitleaks_version=8.30.1
          gitleaks_tar="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_base="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          curl -fsSL "${gitleaks_base}/${gitleaks_tar}" -o "${gitleaks_tar}"
          curl -fsSL "${gitleaks_base}/gitleaks_${gitleaks_version}_checksums.txt" -o gitleaks.sums
          grep " ${gitleaks_tar}$" gitleaks.sums | sha256sum -c -
          tar -xzf "${gitleaks_tar}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gates — fast set (blocking)
        run: scripts/verify-all.sh --strict

      - name: Gate self-test
        run: scripts/tests/test-gates.sh

  # The two gates that need a toolchain and minutes: dependency/licence audit and
  # the coverage floor. Blocking as well, with a timeout so a hang fails loudly
  # instead of silently burning an hour.
  gates-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov

      - name: Install llvm-tools (coverage gate)
        run: rustup component add llvm-tools-preview

      - name: Gates — heavy set (blocking)
        run: scripts/verify-all.sh --full --strict

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # A branch-ref action cannot infer the toolchain from a pinned SHA.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: musl build smoke
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
