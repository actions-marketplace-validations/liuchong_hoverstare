# Dependency, licence and source policy (spec 17 G3).
#
# How this list was written: it is the set of licence expressions actually
# present in the dependency graph (`cargo metadata` → `packages[].license`), not
# a wish list. Adding a dependency with a new licence therefore means adding a
# line here on purpose — that review is the point of the gate.

[advisories]
version = 2
# A known advisory fails the gate: a warning nobody reads is not a gate.
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

# `stringmetrics` (a dev-dependency of httpmock, so it never reaches the binary)
# declares `license = "non-standard"` in its crate metadata while the repository
# ships an Apache-2.0 LICENSE file (Copyright 2022 Trevor Gross). The exception
# records that evidence instead of widening the global allow list.
[[licenses.exceptions]]
name = "stringmetrics"
allow = ["Apache-2.0"]

[bans]
# Several versions of the same crate are normal here (build/dev dependency
# trees); this gate is about credentials and known-bad versions, not about
# deduplication.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
